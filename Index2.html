

<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Ordered List Example</title>
</head>
<body>
    <!--Создание маркированного списка-->
   <ol>
       <li> Яблоки</li>
       <li> Бананы</li>
       <li> Груши</li>
       <li> Мандарины</li>
       <li> Ананасы</li>
   </ol>
   <!--Создание немаркированного списка-->   
   <ul>
       <li> Голубика</li>
       <li> Клубника</li>
       <li> Вишня</li>
       <li> Виноград</li>
       <li> Инжир</li>
   </ul>
   <!--Создание таблицы с 3 столбцами и 3 строками-->
      <table border="1">
       <tr>
           <th>Имя</th>
           <th>Возраст</th>
           <th>Город</th>
       </tr>
       <tr>
           <td>Абылай</td>
           <td>13</td>
           <td>Астана</td>
       </tr>
       <tr>
           <td>Ансар</td>
           <td>11</td>
           <td>Джакарта</td>
       </tr>
        <tr>
           <td>Санжар</td>
           <td>8</td>
           <td>Лагос</td>
       </tr>
   </table>

</body>
