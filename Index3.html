<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Form Elements</title>
</head>
<body>
   <form action="/submit" method="post">
    <!--add input text, textarea, options in fielset-->>
       <fieldset>
       <legend>ВВод личной информации</legend>
       <label for="name">Name:</label>
       <input type="text" id="name" name="name" required>
       <br></br>
       <label for="email">Email:</label>
       <input type="email" id="email" email="email" required>
       <br></br>
       <label for="password">Password:</label>
       <input type="password" id="password" password="password" required>
       <br></br>
       <label for="message">Message:</label>
       <textarea id = "message" name = "message" rows ="3" cols="50"></textarea>
       <br></br>
       <label for="country">Country:</label>
       <select id="country" name="country" required>
           <option value="">Select your country</option>
           <option value="us">United States</option>
           <option value="ca">Canada</option>
           <option value="uk">United Kingdom</option>
           <option value="kz">Kazakhstan</option>
       </select>
       </fieldset>
     <!--add buttons-->>
     <button type = 'submit'>Submit</button>
     <button type = 'reset'>Reset</button>
   </form>
</body>
</html>
